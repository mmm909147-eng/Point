:root{--bg:#0d1527;--bg2:#131c2e;--line:#243250;--tx:#fff;--mut:#9fb0cf;--gold:#FFD700;--ok:#3ddc97;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:var(--gold);cursor:pointer;white-space:nowrap}
.search{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

.lnk,.ib{background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--tx)}
.lnk:hover,.ib:hover,.lnk.on{background:var(--line)}
.btn{background:var(--gold);color:#0d1527;border:0;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{background:var(--gold);color:#0d1527;border-radius:20px;padding:0 7px;font-size:12px;font-weight:700}
main{max-width:1150px;margin:auto;padding:16px}
.hero{position:relative;overflow:hidden;border-radius:18px;min-height:340px;display:flex;align-items:center;background:linear-gradient(135deg,#16254a,#0d1527 60%,#2a2250);margin-bottom:22px}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .in{position:relative;padding:34px;max-width:560px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px}
.hero p{color:#dbe4f7;margin:0 0 18px}
h2{margin:22px 0 12px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:30px;padding:7px 15px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card .ic{font-size:56px;text-align:center;cursor:pointer;background:var(--bg);border-radius:10px;padding:12px}
.price{color:var(--gold);font-weight:800;font-size:17px}
.st{font-size:12px;border-radius:6px;padding:2px 8px;align-self:flex-start}
.st.in{background:#13392e;color:var(--ok)}.st.low{background:#46391a;color:var(--gold)}.st.out{background:#4a1f26;color:var(--bad)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.two{grid-template-columns:1fr}.hero .in{padding:22px}}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
.sc{overflow-x:auto}
.stat{font-size:26px;font-weight:800;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#0d1527;padding:10px 18px;border-radius:10px;font-weight:700;z-index:9}
.mut{color:var(--mut)}.big{font-size:80px;text-align:center}
.sw{display:flex;gap:8px;align-items:center}.sw input{width:auto}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
@media(prefers-reduced-motion:reduce){.hero video{display:none}}
:root{--bg:#eaf4ff;--bg2:rgba(255,255,255,.55);--line:rgba(90,140,200,.35);--tx:#10223f;--mut:#4a6285;--gold:#0a5fc4;--inbg:rgba(255,255,255,.78);--gl:rgba(255,255,255,.28);--glb:rgba(255,255,255,.75);color-scheme:light}

body{background:linear-gradient(180deg,#b9dcff 0%,#e6f2ff 45%,#fff 100%) fixed;min-height:100vh}
:root[data-theme=night] body{background:linear-gradient(180deg,#0d1527,#131c2e) fixed}
header,.panel,.card,.chip{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn{background:var(--gl);color:var(--tx);border:1px solid var(--glb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(20,80,170,.15)}
.btn:hover:not(:disabled){background:var(--glb)}
:root[data-theme=night] .btn{color:var(--gold)}
.hero h1,.hero p,.hero .btn{color:#fff!important}
input,select,textarea{background:var(--inbg)}
.badge,.toast{color:#fff}

:root{--f:"Plus Jakarta Sans","Cairo","Segoe UI",system-ui,sans-serif;--r:22px}
body{font-family:var(--f);font-size:15.5px;line-height:1.6}

:root{--wv:rgba(110,190,255,.5);--wv2:rgba(160,215,255,.5)}

.waves{position:fixed;left:0;right:0;bottom:0;height:48vh;z-index:-1;pointer-events:none;overflow:hidden}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:wv 20s linear infinite}
.waves svg+svg{height:78%;animation-duration:30s;animation-direction:reverse}
.waves path{fill:var(--wv)}.waves svg+svg path{fill:var(--wv2)}
@keyframes wv{to{transform:translateX(-50%)}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover:not(:disabled)::after{transform:translateX(120%)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(20,100,220,.6)}
.chip{transition:transform .15s,border-color .15s}.chip:hover{transform:translateY(-2px);border-color:var(--gold)}
.lnk{transition:background .15s,transform .15s}.lnk:hover{transform:translateY(-1px)}
.btn.buy{background:linear-gradient(135deg,rgba(10,95,196,.92),rgba(60,150,255,.88));color:#fff!important;border-color:transparent}

.acts{display:flex;gap:8px;margin-inline:8px;margin-top:4px}.acts .btn{flex:1;padding:9px 6px}

.fl{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fl span{position:absolute;bottom:-12vh;left:var(--x);font-size:var(--s);opacity:.24;filter:drop-shadow(0 8px 14px rgba(20,90,190,.35));animation:fly var(--d) linear var(--w) infinite}
:root[data-theme=night] .fl span{opacity:.16}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),-60vh) rotate(var(--r))}100%{transform:translate(0,-125vh) rotate(calc(var(--r)*2))}}
